<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>Живой градиент</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 22px;
    background: #16181d;
    color: #e8eaed;
    font: 14px/1.45 -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Рамка телефона: 9:19.5 — пропорции современных моделей. */
  #phone {
    position: relative;
    flex: none;
    aspect-ratio: 9 / 19.5;
    height: min(88vh, 760px);
    padding: 5px;
    border-radius: 42px;
    background: #22252b;
    box-shadow: 0 0 0 1px #34383f, 0 30px 60px -20px rgba(0,0,0,.8);
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 37px;
    background: #0d1020;
  }
  #notch {
    position: absolute;
    top: 15px; left: 50%;
    transform: translateX(-50%);
    width: 82px; height: 23px;
    border-radius: 12px;
    background: rgba(0,0,0,.5);
    pointer-events: none;
    z-index: 3;
  }

  #panel {
    flex: none;
    width: 296px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 18px;
    background: #1d2026;
    border: 1px solid #2e333c;
    border-radius: 16px;
  }
  .hint { margin: 0 0 16px; font-size: 12px; color: #9aa3af; }
  /* Компактная строка: короткая подпись слева, ползунок посередине, число справа. */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row > label {
    flex: 0 0 78px;
    font-size: 12px;
    color: #9aa3af;
  }
  .row .val {
    flex: 0 0 30px;
    text-align: right;
    font-size: 12px;
    color: #9aa3af;
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 auto;
    min-width: 0;
    height: 22px;
    background: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: #363b44;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    margin-top: -7px;
    border: none;
    border-radius: 50%;
    background: #e8eaed;
  }
  /* Выбор пресета: обычный системный select, без своего дизайна. */
  #presets {
    display: block;
    width: 100%;
    min-height: 40px;
    padding: 0 12px;
    margin-bottom: 16px;
    background: #24282f;
    color: #e8eaed;
    border: 1px solid #343a43;
    border-radius: 9px;
    font: inherit;
    cursor: pointer;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .check input {
    width: 17px; height: 17px;
    margin: 0;
    accent-color: #4f8ae0;
    cursor: pointer;
  }

  #swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
  #swatches label { position: relative; }
  input[type=color] {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    padding: 0;
    border: 1px solid #3d434d;
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button {
    flex: 1;
    min-height: 40px;
    padding: 0 12px;
    background: #24282f;
    color: #e8eaed;
    border: 1px solid #343a43;
    border-radius: 9px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #2b3038; }
  button:active { background: #31373f; }
  hr { margin: 18px 0; border: none; border-top: 1px solid #2e333c; }
  @media (max-width: 780px) {
    body { flex-direction: column; gap: 20px; }
    #phone { height: 62vh; }
    #panel { width: 100%; max-width: 420px; }
  }
</style>
</head>
<body>

<div id="phone">
  <canvas id="canvas"></canvas>
  <div id="notch"></div>
</div>

<div id="panel">
  <select id="presets"></select>

  <div class="row">
    <label>Скорость</label>
    <input type="range" id="speed" min="0" max="1000" value="632">
    <span class="val" id="v-speed"></span>
  </div>

  <div class="row">
    <label>Перелив</label>
    <input type="range" id="warp" min="0" max="200" value="100">
    <span class="val" id="v-warp"></span>
  </div>

  <div class="row">
    <label>Размер</label>
    <input type="range" id="scale" min="50" max="200" value="100">
    <span class="val" id="v-scale"></span>
  </div>

  <div class="row">
    <label>Яркость</label>
    <input type="range" id="bright" min="40" max="160" value="100">
    <span class="val" id="v-bright"></span>
  </div>

  <div class="row" id="row-edge">
    <label>Кромка</label>
    <input type="range" id="edge" min="0" max="100" value="35">
    <span class="val" id="v-edge"></span>
  </div>

  <div class="row">
    <label>Зерно</label>
    <input type="range" id="grain" min="0" max="300" value="100">
    <span class="val" id="v-grain"></span>
  </div>

  <label class="check">
    <input type="checkbox" id="spark">
    <span>Искры</span>
  </label>

  <div class="row">
    <label>Количество</label>
    <input type="range" id="sparkcount" min="0" max="300" value="6">
    <span class="val" id="v-sparkcount"></span>
  </div>

  <div class="row">
    <label>Размер</label>
    <input type="range" id="sparksize" min="20" max="400" value="100">
    <span class="val" id="v-sparksize"></span>
  </div>

  <div class="row">
    <label>Мерцание</label>
    <input type="range" id="sparkspeed" min="10" max="500" value="100">
    <span class="val" id="v-sparkspeed"></span>
  </div>

  <div class="row">
    <label>Прозрачность</label>
    <input type="range" id="sparkopacity" min="0" max="100" value="85">
    <span class="val" id="v-sparkopacity"></span>
  </div>

  <div class="row">
    <label>Блик</label>
    <input type="color" id="accent" value="#ffffff">
  </div>

  <hr>

  <div class="row">
    <label>Цвета</label>
    <input type="range" id="count" min="2" max="6" value="4">
    <span class="val" id="v-count"></span>
  </div>

  <div id="swatches"></div>

  <div class="actions">
    <button id="preset">Сброс</button>
    <button id="shuffle">Случайно</button>
  </div>

  <div class="actions">
    <button id="save">Сохранить JSON</button>
    <button id="copy">Скопировать</button>
  </div>
  <div class="actions">
    <button id="load">Загрузить JSON</button>
    <button id="paste">Вставить</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <p class="hint" id="saved" style="margin:10px 0 0"></p>
</div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uWarp;    // сила перелива
uniform float uScale;   // размер пятен
uniform float uBright;  // яркость
uniform float uGrain;   // зерно
uniform int   uCount;   // сколько цветов участвует
uniform vec3  uCol[6];
uniform int   uMode;    // 0 — мягкие пятна, 1 — ленты, 2 — диагонали
uniform float uSpark;      // яркость слоя искр, 0 — выключен
uniform float uSparkThr;   // порог редкости искр — выше значит реже
uniform float uSparkPx;    // uv-размер одного CSS-пикселя, для калибровки искр в px
uniform float uSparkSize;  // коэффициент к базовому размеру искры
uniform float uSparkSpeed; // коэффициент к скорости мерцания
uniform float uEdge;    // резкость кромки в режимах 1 и 2
uniform float uBase;    // базовый тон ленты — сколько кадра остаётся тёмным
uniform float uRim;     // сила глянцевого блика вдоль ленты, 0 — выключен
uniform float uRimPos;  // на каком значении поля сидит блик
uniform float uRimWidth; // ширина блика по полю — чем меньше, тем тоньше линия
uniform float uOrbPulse; // сила кольца-пульса, бегущего от центра к краю (режим 3)
uniform vec3  uAccentCol; // цвет блика/пульса — из палитры, а не зашит в шейдер
uniform float uWall;    // время «по часам»: искры не зависят от скорости фона

// --- Плавный шум на основе value noise -------------------------------
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);   // сглаживание, чтобы не было решётки
  float a = hash2(i               ).x;
  float b = hash2(i + vec2(1., 0.)).x;
  float c = hash2(i + vec2(0., 1.)).x;
  float d = hash2(i + vec2(1., 1.)).x;
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

// Два слоя шума — крупный держит форму, мелкий даёт неровность края.
float fbm(vec2 p) {
  return noise(p) * 0.65 + noise(p * 2.17 + 4.2) * 0.35;
}

// Дизеринг: рвёт видимые ступеньки на тёмных градиентах.
float dither(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
}

// --- Режим 0: мягкие пятна -------------------------------------------
// Поле искажает само себя (domain warping), поэтому пятна текут и меняют
// форму, а не ездят по кругу. Ни направления, ни кромки — мягкий туман.
float fieldBlobs(vec2 p, float t) {
  vec2 q = vec2(fbm(p + vec2(0.0, t * 0.11)),
                fbm(p + vec2(3.7, -t * 0.09) + 1.3));
  vec2 r = vec2(fbm(p + q * uWarp + vec2(t * 0.07, 1.9)),
                fbm(p + q * uWarp + vec2(-1.4, -t * 0.06)));
  // Шум держится около 0.5, поэтому растягиваем диапазон, иначе крайние
  // цвета почти не появляются. Смещение вниз оставляет тёмному больше места.
  float f = fbm(p + r * uWarp);
  return clamp((f - 0.5) * 2.0 + 0.32, 0.0, 1.0);
}

// --- Режим 1: закрученные ленты --------------------------------------
// Здесь важно не значение шума, а его градиент: он задаёт направление
// течения. Закручиваем координату вдоль этого направления — получаются
// ленты. Кромка возникает из-за сжатия поля поперёк потока: uEdge тем
// выше, чем резче нужен край (реф-03 против 01–02).
float fieldRibbons(vec2 p, float t) {
  vec2 e = vec2(0.055, 0.0);
  for (int i = 0; i < 3; i++) {
    // Градиент шума = перпендикуляр к линии уровня, то есть поток.
    float nx = fbm(p + e.xy + vec2(0.0, t * 0.05)) - fbm(p - e.xy + vec2(0.0, t * 0.05));
    float ny = fbm(p + e.yx + vec2(t * 0.04, 0.0)) - fbm(p - e.yx + vec2(t * 0.04, 0.0));
    // Поворот на 90 градусов превращает градиент в направление вихря.
    p += vec2(-ny, nx) * uWarp * 1.5;
  }
  float f = fbm(p * 0.85 + vec2(t * 0.03, -t * 0.05));
  // Сжатие вокруг середины: чем больше uEdge, тем тоньше переход и
  // отчётливее край ленты. Смещение растёт вместе с растяжкой, иначе
  // тёмное съедает кадр целиком.
  f = (f - 0.5) * (1.6 + uEdge * 1.4) + uBase;
  return clamp(f, 0.0, 1.0);
}

// --- Режим 2: диагональные полосы ------------------------------------
// Прямые широкие полосы под 45 градусов, мягко искажённые шумом. Без
// закрутки: направление одно на весь кадр, как в реф-04.
float fieldDiagonal(vec2 p, float t) {
  // Проекция на диагональ задаёт саму полосатость.
  float d = (p.x * 0.72 + p.y * 0.69);
  // Шум только сдвигает полосы, не ломая их направления.
  float wobble = fbm(p * 0.55 + vec2(t * 0.05, -t * 0.04)) - 0.5;
  float f = d * 0.85 + wobble * (0.5 + uWarp * 2.2);
  f = fract(f * 0.5);            // повтор, чтобы полосы шли по всему кадру
  f = abs(f - 0.5) * 2.0;        // треугольная волна: без стыка между копиями
  // Степень 2.5 отдаёт тёмному больше половины кадра, как в референсе;
  // множитель ограничивает верхушку, чтобы яркое не выжигалось в плоское.
  f = pow(f, 2.5) * (0.75 + uEdge * 0.35);
  return clamp(f, 0.0, 1.0);
}

// --- Режим 3: орб (медуза) ---------------------------------------------
// Не поле шума, а радиальное свечение из центра: ближе к центру — ярче,
// к краю — цвет остывает, дальше — растворяется в фоне. Контур не идеальный
// круг — угловой шум слегка колышет радиус (используем силу перелива,
// uWarp, как «на сколько колышется»), плюс медленное дыхание всей формы.
// ndOut отдаём наружу — по нему в main() бежит кольцо-пульс от центра к краю.
float fieldOrb(vec2 uv, float t, out float ndOut) {
  vec2 c = vec2(0.5, 0.56);           // чуть ниже середины — блик внизу, как в референсе
  vec2 dv = uv - c;
  dv.y *= uRes.y / uRes.x;            // круг остаётся круглым на портретном экране
  float ang = atan(dv.y, dv.x);
  float wob = fbm(vec2(cos(ang), sin(ang)) * 1.7 + vec2(t * 0.05, -t * 0.04)) - 0.5;
  float breathe = 1.0 + 0.05 * sin(t * 0.35);   // дыхание — вся форма мягко пульсирует
  float radius = 0.34 * uScale * breathe * (1.0 + wob * uWarp);
  float d = length(dv);
  float nd = d / max(radius, 0.0001);
  ndOut = nd;
  // 2.0 — насколько за номинальный радиус тянется ореол, прежде чем уйти
  // в чёрное; чем больше, тем мягче и дымчатее внешний край.
  return 1.0 - nd / 2.0;
}

// --- Искры ------------------------------------------------------------
// Мелкая сетка ячеек (SPARK_CELLS в ширину — с запасом под до 300 штук),
// в каждой не больше одной искры со своей фазой — иначе они мигают в
// такт, и это сразу читается как узор. Порог редкости берётся со
// слайдера (uSparkThr, JS считает его из целевого числа искр).
//
// Каждые SPARK_GEN секунд по «часам» набор активных ячеек перетасовывается
// на новый случайный — так искры успевают появиться по всей площади, а не
// мигать вечно в одних и тех же точках. Но смена поколения целиком —
// это ДРУГОЙ набор ячеек, не то же самое мигание в новом месте, поэтому
// просто переключить genOff означало бы мгновенный скачок яркости кадр
// в кадр. Вместо этого на каждый пиксель считаем сразу два соседних
// поколения и кроссфейдим между ними (окна половинного нахлёста, как
// в оверлап-эйде): пока одно догорает, следующее уже разгорается.
const float SPARK_CELLS = 16.0;
const float SPARK_GEN = 2.4;

float sparkleGen(vec2 f, vec2 cell, vec2 genOff, float t) {
  float sum = 0.0;
  for (int dy = -1; dy <= 1; dy++) {
    for (int dx = -1; dx <= 1; dx++) {
      vec2 c = cell + vec2(float(dx), float(dy));
      vec2 h = hash2(c + genOff);
      if (h.x < uSparkThr) continue;
      vec2 pos = vec2(h.y, fract(h.x * 7.31));
      float d = length(f - vec2(float(dx), float(dy)) - pos);
      // Мигание своей фазой и своим темпом, медленное.
      float ph = fract(h.x * 3.17 + h.y * 5.71);
      float tw = 0.5 + 0.5 * sin((t * 0.55 * uSparkSpeed + ph) * 6.2831);
      tw = pow(tw, 3.0);                     // короткая вспышка, долгая пауза
      // Разброс размера: 2–5px радиуса (4–10px в диаметре), свой на ячейку.
      vec2 hs = hash2(c + genOff + 17.0);
      float rPx = mix(2.0, 5.0, hs.x) * uSparkSize;
      float rUv = rPx * uSparkPx;
      float dn = d / max(rUv, 0.0001);
      // Резкий спад: ядро точки плюс едва заметный ореол, оба от размера.
      float core = exp(-dn * dn * 3.2);
      float halo = exp(-dn * dn * 0.7) * 0.22;
      sum += (core + halo) * tw;
    }
  }
  return sum;
}

float sparkles(vec2 uv, float t) {
  vec2 g = uv * vec2(SPARK_CELLS, SPARK_CELLS * uRes.y / uRes.x);
  vec2 cell = floor(g);
  vec2 f = fract(g);

  // Сдвиг на пол-периода — границы окон приходятся на середину чужого
  // поколения, а не совпадают с ним, иначе кроссфейд был бы не нужен.
  float genPos = t / SPARK_GEN - 0.5;
  float g0 = floor(genPos);
  float g1 = g0 + 1.0;
  float w1 = smoothstep(0.0, 1.0, fract(genPos));
  float w0 = 1.0 - w1;

  vec2 off0 = vec2(g0 * 13.73, g0 * 91.27);
  vec2 off1 = vec2(g1 * 13.73, g1 * 91.27);
  return sparkleGen(f, cell, off0, t) * w0 + sparkleGen(f, cell, off1, t) * w1;
}

void main() {
  // Координаты 0..1, с поправкой на вытянутость экрана.
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p  = uv;
  p.y *= uRes.y / uRes.x;
  // Больше uScale — крупнее пятна, значит частота ниже. Множитель 1.6
  // задаёт исходный масштаб: пара пятен на портретный экран.
  p *= 1.6 / uScale;

  float t = uTime;

  // Способ рисования выбирает пресет.
  float f;
  float orbNd = 0.0;
  if (uMode == 1)      f = fieldRibbons(p, t);
  else if (uMode == 2) f = fieldDiagonal(p, t);
  else if (uMode == 3) f = fieldOrb(uv, t, orbNd);
  else                 f = fieldBlobs(p, t);

  // Плавный переход по списку цветов: soft-min по расстоянию до стопа.
  float n = float(uCount);
  vec3 acc = vec3(0.0);
  float wsum = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= uCount) break;
    float stop = float(i) / max(n - 1.0, 1.0);
    float d = abs(f - stop);
    // Ширина влияния зависит от числа стопов — переходы остаются мягкими.
    float w = exp(-d * d * (n * n) * 2.2);
    acc += uCol[i] * w;
    wsum += w;
  }
  vec3 col = acc / max(wsum, 0.0001);

  col *= uBright;

  // Лёгкое затемнение к низу — как в референсе.
  col *= 1.0 - 0.22 * pow(1.0 - uv.y, 2.5);

  // Глянцевый блик вдоль ленты: тонкая яркая линия там, где поле проходит
  // через uRimPos (обычно — переход между двумя серединными цветами).
  // В линейном пространстве вместе с остальным цветом, чтобы физически
  // читалось как отражение на материале, а не блик поверх картинки.
  if (uRim > 0.0) {
    float rd = (f - uRimPos) / max(uRimWidth, 0.0001);
    float rim = exp(-rd * rd);
    col += uAccentCol * rim * uRim;
  }

  // Едва заметное дыхание света, бегущее от центра к краю — не линии, а
  // мягкая волна яркости. pow(cos, 8) вместо smoothstep даёт колоколообразный,
  // размытый пик без жёсткой границы; cos периодичен сам по себе, поэтому
  // зацикливается без скачка цвета.
  if (uOrbPulse > 0.0) {
    float wave = cos((orbNd * 1.4 - t * 0.07) * 6.2831) * 0.5 + 0.5;
    float glow = pow(wave, 8.0);
    float envelope = exp(-orbNd * orbNd * 1.3);
    col += uAccentCol * glow * envelope * uOrbPulse;
  }

  // Обратно в sRGB: смешивали в линейном, показываем в экранном.
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));

  // Искры — уже в экранном пространстве: это блики поверх картинки, а не
  // часть градиента, поэтому просто добавляются к цвету.
  if (uSpark > 0.0) {
    float s = sparkles(uv, uWall);
    // Чуть холодный оттенок, как на референсах.
    col += vec3(0.93, 0.95, 1.0) * s * uSpark;
  }

  // Зерно поверх, плюс дизеринг против полос.
  float g = (fract(sin(dot(gl_FragCoord.xy, vec2(12.99, 78.23))) * 43758.55) - 0.5);
  col += g * uGrain;
  col += dither(gl_FragCoord.xy) / 255.0;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

if (!gl) {
  document.getElementById("panel").insertAdjacentHTML("afterbegin",
    "<p style=\"color:#ff9f5a\">WebGL недоступен в этом браузере.</p>");
  throw new Error("no webgl");
}

// Пять пресетов. Палитры сняты пробами из референсов в img/ — цвета
// отсортированы от тёмного к светлому, шейдер раскладывает их по полю.
// mode: 0 — мягкие пятна, 1 — закрученные ленты, 2 — диагональные полосы,
// 3 — орб (медуза): радиальное свечение из центра, не поле шума.
// edge — резкость кромки (для режима 0 не используется).
const PRESETS = [
  {
    name: "Туман",
    mode: 0, edge: 0, base: 0.34, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0, accent: "#ffffff",
    speed: 632, warp: 100, scale: 100, bright: 100, grain: 100, spark: false, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#0d1020", "#232a4d", "#7b3fc4", "#c49bc8"],
  },
  {
    name: "Лента",
    mode: 1, edge: 95, base: 0.14, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0, accent: "#ffffff",
    speed: 632, warp: 85, scale: 145, bright: 100, grain: 100, spark: true, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#04030a", "#170f35", "#2f6fae", "#c94fb0", "#ff5d6c", "#ffc24d"],
  },
  {
    name: "Холод",
    mode: 1, edge: 30, base: 0.364, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0, accent: "#ffffff",
    speed: 588, warp: 90, scale: 120, bright: 100, grain: 100, spark: true, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#050209", "#150b28", "#2c2181", "#593a8d", "#ca86cc", "#f2cf57"],
  },
  {
    name: "Кислота",
    mode: 1, edge: 85, base: 0.408, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0, accent: "#ffffff",
    speed: 661, warp: 115, scale: 105, bright: 105, grain: 100, spark: true, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#050209", "#472493", "#5424a0", "#d94199", "#e5f190", "#f7e30b"],
  },
  {
    name: "Диагонали",
    mode: 2, edge: 45, base: 0.34, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0, accent: "#ffffff",
    speed: 612, warp: 70, scale: 130, bright: 100, grain: 100, spark: false, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#050209", "#2a1550", "#62429c", "#a230a5", "#cb1e61", "#ffb347"],
  },
  {
    name: "Нить",
    mode: 1, edge: 80, base: 0.11, rim: 1.1, rimPos: 0.32, rimWidth: 0.025, orbPulse: 0, accent: "#fffcff",
    speed: 632, warp: 70, scale: 190, bright: 100, grain: 100, spark: false, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#000000", "#020204", "#1c5fc9", "#7b2fd4", "#ff4d1f", "#ffb648"],
  },
  {
    name: "Медуза",
    mode: 3, edge: 0, base: 0.34, rim: 0, rimPos: 0.5, rimWidth: 0.05, orbPulse: 0.22, accent: "#edf6ff",
    speed: 632, warp: 22, scale: 100, bright: 100, grain: 100, spark: false, sparkCount: 6, sparkSize: 100, sparkSpeed: 100, sparkOpacity: 85,
    colors: ["#000000", "#170502", "#c23a1a", "#16217a", "#4f7fe0", "#eef3ff"],
  },
];

const MAX_COLORS = 6;

// Живое состояние каждого слота: правки не теряются при переключении.
const slots = PRESETS.map(p => ({
  mode: p.mode, edge: p.edge, base: p.base, spark: p.spark,
  rim: p.rim, rimPos: p.rimPos, rimWidth: p.rimWidth, orbPulse: p.orbPulse,
  accent: p.accent,
  sparkCount: p.sparkCount, sparkSize: p.sparkSize,
  sparkSpeed: p.sparkSpeed, sparkOpacity: p.sparkOpacity,
  speed: p.speed, warp: p.warp, scale: p.scale,
  bright: p.bright, grain: p.grain,
  colors: p.colors.slice(),
}));
let active = 0;
let colors = slots[0].colors;
const accentInput = document.getElementById("accent");
let accentColor = slots[0].accent;
accentInput.addEventListener("input", () => { accentColor = accentInput.value; });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById("vert").textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// Один прямоугольник на весь экран.
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ["uRes","uTime","uWarp","uScale","uBright","uGrain","uCount",
                 "uMode","uSpark","uSparkThr","uSparkPx","uSparkSize","uSparkSpeed",
                 "uEdge","uBase","uRim","uRimPos","uRimWidth","uOrbPulse",
                 "uAccentCol","uWall"]) {
  U[n] = gl.getUniformLocation(prog, n);
}
const uColLoc = [];
for (let i = 0; i < MAX_COLORS; i++) {
  uColLoc.push(gl.getUniformLocation(prog, "uCol[" + i + "]"));
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  // sRGB -> линейное: без этого смешение цветов выглядит грязным.
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]
    .map(c => Math.pow(c, 2.2));
}

const S = {};
for (const id of ["speed","warp","scale","bright","grain","count","edge","sparkcount",
                  "sparksize","sparkspeed","sparkopacity"]) {
  S[id] = document.getElementById(id);
}
const sparkBox = document.getElementById("spark");

// --- Слоты пресетов ---------------------------------------------------
// Ползунки — единственный источник правды для активного слота. Перед
// уходом на другой слот значения складываются обратно в него.
function saveSlot() {
  const s = slots[active];
  s.speed  = +S.speed.value;
  s.warp   = +S.warp.value;
  s.scale  = +S.scale.value;
  s.bright = +S.bright.value;
  s.grain  = +S.grain.value;
  s.edge   = +S.edge.value;
  s.spark  = sparkBox.checked;
  s.sparkCount   = +S.sparkcount.value;
  s.sparkSize    = +S.sparksize.value;
  s.sparkSpeed   = +S.sparkspeed.value;
  s.sparkOpacity = +S.sparkopacity.value;
  s.colors = colors.slice(0, +S.count.value);
  s.accent = accentColor;
}

function loadSlot(i) {
  active = i;
  const s = slots[i];
  S.speed.value  = s.speed;
  S.warp.value   = s.warp;
  S.scale.value  = s.scale;
  S.bright.value = s.bright;
  S.grain.value  = s.grain;
  S.edge.value   = s.edge;
  S.count.value  = s.colors.length;
  S.sparkcount.value   = s.sparkCount;
  S.sparksize.value    = s.sparkSize;
  S.sparkspeed.value   = s.sparkSpeed;
  S.sparkopacity.value = s.sparkOpacity;
  sparkBox.checked = s.spark;
  colors = s.colors.slice();
  accentColor = s.accent;
  accentInput.value = s.accent;
  buildSwatches();
  showValues();
  presetSelect.value = i;
  // Режим лент и диагоналей регулируется кромкой, мягкие пятна и орб — нет.
  document.getElementById("row-edge").style.display =
    (s.mode === 0 || s.mode === 3) ? "none" : "";
}

// Ползунок скорости нелинейный: 0..15x на кубической кривой. Иначе рабочая
// зона «почти незаметно» (0.3..2x) сжимается в первые проценты хода.
const SPEED_MAX = 15;
function speedMul() {
  const u = +S.speed.value / 1000;
  return u * u * SPEED_MAX;
}
const swatchBox = document.getElementById("swatches");

// Поля цвета: их столько, сколько выбрано ползунком.
function buildSwatches() {
  const n = +S.count.value;
  swatchBox.textContent = "";
  for (let i = 0; i < n; i++) {
    // Заполняем пропуски сразу: иначе новый стоп виден на экране серым,
    // а в выгрузке его нет.
    if (!colors[i]) colors[i] = "#404040";
    const inp = document.createElement("input");
    inp.type = "color";
    inp.value = colors[i];
    inp.addEventListener("input", () => { colors[i] = inp.value; });
    swatchBox.appendChild(inp);
  }
}

// Выбор пресета — обычный select, список рисует сама система.
const presetSelect = document.getElementById("presets");
PRESETS.forEach((p, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = p.name;
  presetSelect.appendChild(opt);
});
presetSelect.addEventListener("change", () => {
  const i = +presetSelect.value;
  if (i === active) return;
  saveSlot();
  loadSlot(i);
});

function showValues() {
  const m = speedMul();
  document.getElementById("v-speed").textContent =
    (m === 0 ? "стоп" : (m < 1 ? m.toFixed(2) : m.toFixed(1)) + "x");
  document.getElementById("v-warp").textContent   = (+S.warp.value / 100).toFixed(2);
  document.getElementById("v-scale").textContent  = (+S.scale.value / 100).toFixed(2);
  document.getElementById("v-bright").textContent = (+S.bright.value / 100).toFixed(2);
  document.getElementById("v-grain").textContent  = (+S.grain.value / 100).toFixed(2);
  document.getElementById("v-count").textContent  = S.count.value;
  document.getElementById("v-edge").textContent   = (+S.edge.value / 100).toFixed(2);
  document.getElementById("v-sparkcount").textContent = S.sparkcount.value;
  document.getElementById("v-sparksize").textContent    = (+S.sparksize.value / 100).toFixed(2) + "x";
  document.getElementById("v-sparkspeed").textContent   = (+S.sparkspeed.value / 100).toFixed(2) + "x";
  document.getElementById("v-sparkopacity").textContent = S.sparkopacity.value + "%";
}

S.count.addEventListener("input", () => { buildSwatches(); showValues(); });
for (const id of ["speed","warp","scale","bright","grain","edge","sparkcount",
                  "sparksize","sparkspeed","sparkopacity"]) {
  S[id].addEventListener("input", showValues);
}

// Сброс возвращает к исходному только активный пресет, остальные не трогает.
document.getElementById("preset").addEventListener("click", () => {
  const p = PRESETS[active];
  slots[active] = {
    mode: p.mode, edge: p.edge, base: p.base, spark: p.spark,
    rim: p.rim, rimPos: p.rimPos, rimWidth: p.rimWidth, orbPulse: p.orbPulse,
  accent: p.accent,
    sparkCount: p.sparkCount, sparkSize: p.sparkSize,
    sparkSpeed: p.sparkSpeed, sparkOpacity: p.sparkOpacity,
    speed: p.speed, warp: p.warp, scale: p.scale,
    bright: p.bright, grain: p.grain,
    colors: p.colors.slice(),
  };
  loadSlot(active);
});

// Случайная палитра: тёмная база + один-два ярких акцента, как в референсе.
document.getElementById("shuffle").addEventListener("click", () => {
  const base = Math.random() * 360;
  const n = +S.count.value;
  colors = Array.from({ length: n }, (_, i) => {
    const h = (base + i * (25 + Math.random() * 40)) % 360;
    const l = 8 + (i / Math.max(n - 1, 1)) * 62;
    const s = 35 + Math.random() * 45;
    return hslToHex(h, s, l);
  });
  buildSwatches();
});

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = v => Math.round(v * 255).toString(16).padStart(2, "0");
  return "#" + to(f(0)) + to(f(8)) + to(f(4));
}

// --- Выгрузка параметров ---------------------------------------------
// Складываем осмысленные значения, а не позиции ползунков: разработчику
// нужны множители, которые уходят в шейдер, плюс константы, без которых
// картинку не повторить.
const MODE_NAMES = ["softBlobs", "ribbons", "diagonalBands"];

// Один пресет в виде значений, уходящих в шейдер.
function presetConfig(s, i) {
  const speed = (s.speed / 1000) * (s.speed / 1000) * SPEED_MAX;
  return {
    index: i + 1,
    name: PRESETS[i].name,
    mode: MODE_NAMES[s.mode] || "softBlobs",
    animation: {
      speed: +speed.toFixed(2),                 // множитель темпа, 0..15
      cycleSeconds: speed > 0                   // за столько обновляется картина
        ? +(1 / (0.25 * speed * 0.11)).toFixed(1)
        : null,
    },
    look: {
      warp: +((s.warp / 100) * 0.55).toFixed(4),      // uWarp
      scale: +(s.scale / 100).toFixed(3),             // uScale
      brightness: +(s.bright / 100).toFixed(3),       // uBright
      grain: +((s.grain / 100) * 0.05).toFixed(4),    // uGrain
      edge: +(s.edge / 100).toFixed(3),               // uEdge, кромка
      base: +s.base.toFixed(3),                       // uBase, базовый тон
      rim: +s.rim.toFixed(3),                         // uRim, сила глянцевого блика
      rimPos: +s.rimPos.toFixed(3),                   // uRimPos
      rimWidth: +s.rimWidth.toFixed(4),                // uRimWidth
      orbPulse: +s.orbPulse.toFixed(3),                // uOrbPulse
      accent: s.accent,                                // uAccentCol, цвет блика/пульса
      sparkles: s.spark,
      sparklesCount: s.sparkCount,                    // 0..300, целевое число искр
      sparklesSize: +(s.sparkSize / 100).toFixed(3),        // uSparkSize
      sparklesSpeed: +(s.sparkSpeed / 100).toFixed(3),      // uSparkSpeed
      sparklesOpacity: +(s.sparkOpacity / 100).toFixed(3),  // uSpark
    },
    gradient: {
      count: s.colors.length,
      colors: s.colors.slice(),
    },
  };
}

function config() {
  saveSlot();     // на диск уходит то, что сейчас на ползунках
  return {
    _: "Библиотека градиентов. Экспорт из shaders/index.html",
    activePreset: active + 1,
    presets: slots.map(presetConfig),
    shaderConstants: {
      timeStep: 0.25,              // t += dt * speed * 0.25
      baseFrequency: 1.6,          // p *= baseFrequency / uScale
      bottomFade: 0.22,            // затемнение к низу, степень 2.5
      colorSpace: "смешение в линейном (gamma 2.2), вывод в sRGB",
      falloff: "exp(-d*d*count*count*2.2) по расстоянию до стопа",
      softBlobs: "domain warping в 2 прохода; f = (fbm - .5) * 2 + .32",
      ribbons: "3 прохода закрутки по градиенту шума, повёрнутому на 90°; " +
               "f = (fbm - .5) * (1.6 + edge * 1.4) + base",
      rim: "глянцевый блик поверх ленты: rim * exp(-((f-rimPos)/rimWidth)^2), " +
           "в линейном пространстве до гамма-коррекции, цвет (1, .97, 1)",
      diagonalBands: "проекция на диагональ (.72, .69), треугольная волна, " +
                     "f = pow(tri, 2.5) * (.75 + edge * .35)",
      orb: "радиальное свечение из центра (.5, .56): f = 1 - nd/1.7, где " +
           "nd = расстояние/радиус; контур колышет угловой fbm * warp, " +
           "вся форма дышит (радиус *= 1 + .05*sin(t*.35)); orbPulse — " +
           "кольцо-пульс, бежит по nd от центра к краю каждые ~8.3с",
      sparkles: "сетка 16 ячеек в ширину, целиком перетасовывается каждые 2.4с " +
                "по uWall; sparklesCount 0..300 -> порог из totalCells; размер " +
                "2-5px радиуса * sparklesSize; мигание по uWall * sparklesSpeed, " +
                "независимо от скорости фона; яркость слоя = sparklesOpacity",
    },
    screen: { aspect: "9:19.5", orientation: "portrait", maxPixelRatio: 2 },
  };
}

const saved = document.getElementById("saved");
let savedTimer;
function flash(msg) {
  saved.textContent = msg;
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { saved.textContent = ""; }, 3200);
}

// --- Загрузка параметров ---------------------------------------------
// Обратный перевод: в файле значения для шейдера, ползункам нужны их
// внутренние единицы. Всё, чего в файле нет, остаётся как было.
const HEX = /^#[0-9a-fA-F]{6}$/;

function clampTo(el, v) {
  return Math.max(+el.min, Math.min(+el.max, Math.round(v)));
}

// Значения из файла кладём прямо в слот, минуя ползунки: так один вызов
// восстанавливает любой из пяти пресетов, а не только активный.
function applyToSlot(slot, block) {
  const a = block.animation || {};
  const l = block.look || {};
  const g = block.gradient || {};
  let touched = 0;

  const lim = (el, v) => Math.max(+el.min, Math.min(+el.max, Math.round(v)));

  if (typeof a.speed === "number") {
    // speed = u^2 * 15  ->  u = sqrt(speed / 15)
    slot.speed = lim(S.speed, Math.sqrt(Math.max(0, a.speed) / SPEED_MAX) * 1000);
    touched++;
  }
  if (typeof l.warp === "number")       { slot.warp   = lim(S.warp,  l.warp / 0.55 * 100); touched++; }
  if (typeof l.scale === "number")      { slot.scale  = lim(S.scale, l.scale * 100); touched++; }
  if (typeof l.brightness === "number") { slot.bright = lim(S.bright, l.brightness * 100); touched++; }
  if (typeof l.grain === "number")      { slot.grain  = lim(S.grain, l.grain / 0.05 * 100); touched++; }
  if (typeof l.edge === "number")       { slot.edge   = lim(S.edge,  l.edge * 100); touched++; }
  if (typeof l.base === "number")       { slot.base   = Math.max(0, Math.min(1, l.base)); touched++; }
  if (typeof l.rim === "number")        { slot.rim      = Math.max(0, l.rim); touched++; }
  if (typeof l.rimPos === "number")     { slot.rimPos   = Math.max(0, Math.min(1, l.rimPos)); touched++; }
  if (typeof l.rimWidth === "number")   { slot.rimWidth = Math.max(0.001, l.rimWidth); touched++; }
  if (typeof l.orbPulse === "number")   { slot.orbPulse = Math.max(0, l.orbPulse); touched++; }
  if (typeof l.accent === "string" && HEX.test(l.accent.trim())) {
    slot.accent = l.accent.trim().toLowerCase();
    touched++;
  }
  if (typeof l.sparkles === "boolean")  { slot.spark  = l.sparkles; touched++; }
  if (typeof l.sparklesCount === "number") { slot.sparkCount = lim(S.sparkcount, l.sparklesCount); touched++; }
  if (typeof l.sparklesSize === "number") { slot.sparkSize = lim(S.sparksize, l.sparklesSize * 100); touched++; }
  if (typeof l.sparklesSpeed === "number") { slot.sparkSpeed = lim(S.sparkspeed, l.sparklesSpeed * 100); touched++; }
  if (typeof l.sparklesOpacity === "number") { slot.sparkOpacity = lim(S.sparkopacity, l.sparklesOpacity * 100); touched++; }

  const mi = MODE_NAMES.indexOf(block.mode);
  if (mi >= 0) { slot.mode = mi; touched++; }

  if (Array.isArray(g.colors) && g.colors.length) {
    const list = g.colors.filter(c => typeof c === "string" && HEX.test(c.trim()))
                         .map(c => c.trim().toLowerCase());
    if (!list.length) throw new Error("цвета не распознаны, нужен формат #rrggbb");
    // Число стопов берём по факту из списка цветов: count в файле может
    // с ним расходиться, а на экране должно совпадать.
    slot.colors = list.slice(0, MAX_COLORS);
    touched++;
  }
  return touched;
}

function applyConfig(cfg) {
  if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)) {
    throw new Error("это не файл настроек");
  }

  let touched = 0;

  if (Array.isArray(cfg.presets) && cfg.presets.length) {
    // Новый формат: библиотека целиком. Лишние пресеты игнорируем,
    // недостающие оставляем как есть.
    cfg.presets.slice(0, slots.length).forEach((block, i) => {
      if (block && typeof block === "object") touched += applyToSlot(slots[i], block);
    });
    const ai = cfg.activePreset;
    const target = (typeof ai === "number" && ai >= 1 && ai <= slots.length)
      ? ai - 1 : active;
    if (!touched) throw new Error("в пресетах нет знакомых параметров");
    loadSlot(target);
    return touched;
  }

  // Старый формат — один плоский набор, кладём в активный слот.
  touched = applyToSlot(slots[active], cfg);
  if (!touched) throw new Error("знакомых параметров в файле нет");
  loadSlot(active);
  return touched;
}

function loadText(text, source) {
  let cfg;
  try {
    cfg = JSON.parse(text);
  } catch {
    flash("Не похоже на JSON — файл повреждён или скопирован не целиком.");
    return;
  }
  try {
    const n = applyConfig(cfg);
    flash("Настройки применены (" + source + "), параметров: " + n + ".");
  } catch (e) {
    flash("Не применилось: " + e.message);
  }
}

const fileInput = document.getElementById("file");
document.getElementById("load").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadText(String(r.result), f.name);
  r.onerror = () => flash("Файл не прочитался.");
  r.readAsText(f);
  fileInput.value = "";   // чтобы тот же файл можно было выбрать повторно
});

document.getElementById("paste").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text.trim()) { flash("В буфере пусто."); return; }
    loadText(text, "из буфера");
  } catch {
    flash("Браузер не дал прочитать буфер, нажми «Загрузить JSON».");
  }
});

// Перетаскивание файла на экран телефона — самый короткий путь.
const phone = document.getElementById("phone");
for (const ev of ["dragover", "dragenter"]) {
  phone.addEventListener(ev, e => {
    e.preventDefault();
    phone.style.boxShadow = "0 0 0 2px #5aa9ff, 0 30px 60px -20px rgba(0,0,0,.8)";
  });
}
for (const ev of ["dragleave", "drop"]) {
  phone.addEventListener(ev, () => { phone.style.boxShadow = ""; });
}
phone.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadText(String(r.result), f.name);
  r.readAsText(f);
});

document.getElementById("save").addEventListener("click", () => {
  const json = JSON.stringify(config(), null, 2);
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "gradient-params.json";
  a.click();
  URL.revokeObjectURL(url);
  flash("Файл gradient-params.json — в загрузках.");
});

document.getElementById("copy").addEventListener("click", async () => {
  const json = JSON.stringify(config(), null, 2);
  try {
    await navigator.clipboard.writeText(json);
    flash("Параметры в буфере — можно вставлять.");
  } catch {
    flash("Браузер не дал доступ к буферу, нажми «Сохранить JSON».");
  }
});

function resize() {
  // Ограничиваем плотность: на retina полноразмерный рендер тёмного
  // градиента греет телефон без видимой пользы.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

let t = 0;
let wall = 0;                        // время «по часам», для искр
let last = performance.now();

function frame(now) {
  // Время копим сами: тогда ползунок скорости не дёргает картинку,
  // а плавно меняет темп течения.
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  // 0.25 подобрано так, чтобы на 1.0x композиция обновлялась за ~36 сек:
  // движение видно только при сравнении, а не при взгляде в упор.
  t += dt * speedMul() * 0.25;
  wall += dt;                        // искры мигают ровно, независимо от фона

  resize();

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uWall, wall);
  gl.uniform1f(U.uWarp, (+S.warp.value / 100) * 0.55);
  gl.uniform1f(U.uScale, +S.scale.value / 100);
  gl.uniform1f(U.uBright, +S.bright.value / 100);
  gl.uniform1f(U.uGrain, (+S.grain.value / 100) * 0.05);
  gl.uniform1i(U.uCount, +S.count.value);
  gl.uniform1i(U.uMode, slots[active].mode);
  gl.uniform1f(U.uEdge, +S.edge.value / 100);
  gl.uniform1f(U.uBase, slots[active].base);
  gl.uniform1f(U.uRim, slots[active].rim);
  gl.uniform1f(U.uRimPos, slots[active].rimPos);
  gl.uniform1f(U.uRimWidth, slots[active].rimWidth);
  gl.uniform1f(U.uOrbPulse, slots[active].orbPulse);
  gl.uniform3fv(U.uAccentCol, hexToRgb(accentColor || "#ffffff"));
  gl.uniform1f(U.uSpark, sparkBox.checked ? +S.sparkopacity.value / 100 : 0.0);
  gl.uniform1f(U.uSparkSize, +S.sparksize.value / 100);
  gl.uniform1f(U.uSparkSpeed, +S.sparkspeed.value / 100);
  // Слайдер — целевое число искр; порог считаем из размера сетки (SPARK_CELLS
  // в шейдере, держим то же число здесь), чтобы значение слайдера примерно
  // совпадало с тем, сколько ячеек реально пройдёт порог.
  {
    const cellsX = 16;
    const cellsY = cellsX * (canvas.height / (canvas.width || 1));
    const totalCells = cellsX * cellsY;
    const thr = 1 - (+S.sparkcount.value) / totalCells;
    gl.uniform1f(U.uSparkThr, Math.max(0, Math.min(1, thr)));
  }
  // uv на один CSS-пиксель: искры калибруются в px независимо от dpr.
  gl.uniform1f(U.uSparkPx, canvas.clientWidth ? 1 / canvas.clientWidth : 0);
  for (let i = 0; i < +S.count.value; i++) {
    gl.uniform3fv(uColLoc[i], hexToRgb(colors[i] || "#404040"));
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

loadSlot(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
